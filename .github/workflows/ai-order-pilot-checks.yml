name: AI order pilot checks

on:
  pull_request:
    paths:
      - 'ai_order_*.py'
      - 'handlers_ai_order.py'
      - 'handlers_order.py'
      - 'handlers_start.py'
      - 'keyboards.py'
      - 'config.py'
      - 'test_ai_order_*.py'
      - '.github/workflows/ai-order-pilot-checks.yml'
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall -q .
      - name: Run AI extraction and validation tests
        run: python -m unittest -v test_ai_order_core.py test_ai_order_extract.py test_ai_order_access.py
      - name: Verify Telegram routers import together
        run: python -c "import handlers_order; import handlers_ai_order; import keyboards; print('AI routes load')"
      - name: Check existing Docker installer compatibility
        run: python install_solution.py
      - name: Check existing price conversion tests
        run: python -m unittest -v test_price_solution.py
